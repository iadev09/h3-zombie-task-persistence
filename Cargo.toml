[workspace]
members = ["h3-client", "h3-server"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
quinn = "0.11.9"
rcgen = "0.13"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
